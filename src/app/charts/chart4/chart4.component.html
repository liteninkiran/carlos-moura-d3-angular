<div class="chart-4">

    <div class="controller">
        <app-dropdown
            [options]="data?.columns"
            placeholder="X Variable"
            [selected]="xValue"
            (selectionChange)="setOption('x', $event)">
        </app-dropdown>

        <app-dropdown
            [options]="data?.columns"
            placeholder="Y Variable"
            [selected]="yValue"
            (selectionChange)="setOption('y', $event)">
        </app-dropdown>
    </div>

    <div class="body">
        <svg></svg>
    </div>

</div>
